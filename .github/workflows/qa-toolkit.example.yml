# QA Toolkit — GitHub Actions pipeline
#
# Runs on every push and PR. Gates deploys by running the full QA sweep
# against a staging-grade Laravel environment.
#
# Publish to your project as:
#   php artisan vendor:publish --tag=qa-toolkit-ci
# Or copy this file to .github/workflows/qa-toolkit.yml

name: QA Toolkit

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (security|performance|functional|infra|all)'
        required: false
        default: 'all'

permissions:
  contents: read

jobs:
  qa-toolkit:
    name: Pre-launch QA Sweep
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_qa
          MYSQL_USER: qa
          MYSQL_PASSWORD: qa-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:xT1t0P5gK0jUqN1jY8n3oR2k8wU5tQ+T8vW2xY7zU5c=
      APP_URL: https://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_qa
      DB_USERNAME: qa
      DB_PASSWORD: qa-secret
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      QA_FAIL_ON: warning
      QA_FORMAT: markdown

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, redis, bcmath, opcache, intl, gd
          coverage: xdebug
          ini-values: memory_limit=512M, opcache.enable=1, opcache.enable_cli=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install QA Toolkit (if not yet in composer.json)
        run: |
          if ! composer show khalequzzaman17/qa-toolkit-laravel 2>/dev/null; then
            composer config repositories.toolkit path ./packages/qa-toolkit || true
            composer require khalequzzaman17/qa-toolkit-laravel:dev-main --no-update
            composer install --no-interaction --prefer-dist
          fi

      - name: Publish QA Toolkit config + CI files
        run: |
          php artisan vendor:publish --tag=qa-toolkit-config --force || true
          php artisan vendor:publish --tag=qa-toolkit-stubs --force || true

      - name: Build frontend assets (Vite)
        run: |
          npm ci
          npm run build

      - name: Generate application key (if not set)
        run: php artisan key:generate --ansi || true

      - name: Run database migrations
        run: php artisan migrate --force --ansi

      - name: Run database seeders (testing only)
        run: php artisan db:seed --force --ansi || true

      - name: Cache framework bootstrap files
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache || true

      - name: Run the full test suite (Pest/PHPUnit)
        run: |
          if [ -f vendor/bin/pest ]; then
            vendor/bin/pest --stop-on-failure --coverage --min=70
          else
            vendor/bin/phpunit --stop-on-failure
          fi

      - name: Run QA Toolkit — security suite
        if: github.event.inputs.suite == '' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'security'
        run: php artisan qa:security --report=storage/app/qa-security.md
        continue-on-error: false

      - name: Run QA Toolkit — performance suite
        if: github.event.inputs.suite == '' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'performance'
        run: php artisan qa:performance --report=storage/app/qa-performance.md
        continue-on-error: false

      - name: Run QA Toolkit — functional suite
        if: github.event.inputs.suite == '' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'functional'
        run: php artisan qa:functional --report=storage/app/qa-functional.md
        continue-on-error: false

      - name: Run QA Toolkit — infra suite (stub)
        if: github.event.inputs.suite == '' || github.event.inputs.suite == 'all' || github.event.inputs.suite == 'infra'
        run: php artisan qa:infra --report=storage/app/qa-infra.md
        # Allow failures in CI infra — many checks expect a live production host.
        continue-on-error: true

      - name: Run QA Toolkit — full sweep (summary)
        run: |
          php artisan qa:run --format=markdown --report=storage/app/qa-report.md
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}

      - name: Upload QA reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            storage/app/qa-*.md
            storage/app/qa-*.json
          retention-days: 30

      - name: Fail the build if QA failed
        if: always()
        run: |
          php artisan qa:report --format=json --path=storage/app/qa-summary.json
          jq -r '.worst_severity' storage/app/qa-summary.json | tee /tmp/worst.txt
          WORST=$(cat /tmp/worst.txt)
          if [ "$WORST" = "critical" ] || [ "$WORST" = "error" ]; then
            echo "::error::QA sweep reports $WORST — see artifacts."
            exit 1
          fi

  deploy-gate:
    name: Deploy Gate (manual)
    needs: qa-toolkit
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Confirm deploy
        run: echo "QA passed — ready to roll out."
